{
  // Wrapper-prequote ECDSA path:
  // sgx_ql_get_quote_config() uses pccs_url for PCK cert retrieval, unlike
  // verifier-side collateral fetches that can rely on collateral_service.
  "pccs_url": "https://localhost:8081/sgx/certification/v4/",

  // Keep verifier collateral aligned with the stock Intel path if the same
  // config is reused outside the stop-after-quote-size benchmark.
  "collateral_service": "https://api.trustedservices.intel.com/sgx/certification/v4/",

  "retry_times": 0,
  "verify_collateral_cache_expire_hours": 168,
  "local_cache_only": false,

  // The host PCCS test service uses a local certificate.
  "use_secure_cert": false
}
